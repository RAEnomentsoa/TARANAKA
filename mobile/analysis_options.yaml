include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - lib/l10n/gen/**
    - android/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_print
    - always_declare_return_types
    - unawaited_futures

formatter:
  page_width: 110
