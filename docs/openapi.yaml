openapi: 3.0.3
info:
  title: TARANAKA API
  version: 1.0.0
  description: API du serveur central TARANAKA.
paths:
  /api/access-requests/:
    get:
      operationId: access_requests_list
      description: '/access-requests/: the admin reads, approves or refuses the requests.'
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: profil_demande
        schema:
          type: string
          enum:
          - agent_csb
          - superviseur
        description: |-
          * `agent_csb` - Agent de CSB
          * `superviseur` - Superviseur
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - approuvee
          - en_attente
          - refusee
        description: |-
          * `en_attente` - En attente
          * `approuvee` - Approuvée
          * `refusee` - Refusée
      tags:
      - access-requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDemandeAccesAdminList'
          description: ''
  /api/access-requests/{id}/:
    get:
      operationId: access_requests_retrieve
      description: '/access-requests/: the admin reads, approves or refuses the requests.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) Demande d'accès.
        required: true
      tags:
      - access-requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeAccesAdmin'
          description: ''
  /api/access-requests/{id}/approve/:
    post:
      operationId: access_requests_approve_create
      description: '/access-requests/: the admin reads, approves or refuses the requests.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) Demande d'accès.
        required: true
      tags:
      - access-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprobationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprobationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprobationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeAccesAdmin'
          description: ''
  /api/access-requests/{id}/refuse/:
    post:
      operationId: access_requests_refuse_create
      description: '/access-requests/: the admin reads, approves or refuses the requests.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) Demande d'accès.
        required: true
      tags:
      - access-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefusRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeAccesAdmin'
          description: ''
  /api/appointments/:
    get:
      operationId: appointments_list
      description: '/appointments/: follow-up visits; ?manque=true lists the missed
        ones.'
      parameters:
      - in: query
        name: csb
        schema:
          type: number
      - in: query
        name: date_max
        schema:
          type: string
          format: date
      - in: query
        name: date_min
        schema:
          type: string
          format: date
      - in: query
        name: enfant
        schema:
          type: string
          format: uuid
      - in: query
        name: manque
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - annule
          - honore
          - prevu
        description: |-
          * `prevu` - Prévu
          * `honore` - Honoré
          * `annule` - Annulé
      - in: query
        name: type_rendez_vous
        schema:
          type: string
          enum:
          - controle
          - depistage
        description: |-
          * `controle` - Contrôle
          * `depistage` - Dépistage
      - in: query
        name: updated_since
        schema:
          type: string
          format: date-time
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRendezVousList'
          description: ''
    post:
      operationId: appointments_create
      description: '/appointments/: follow-up visits; ?manque=true lists the missed
        ones.'
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RendezVousRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RendezVousRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RendezVousRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RendezVous'
          description: ''
  /api/appointments/{id}/:
    get:
      operationId: appointments_retrieve
      description: '/appointments/: follow-up visits; ?manque=true lists the missed
        ones.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) Rendez-vous.
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RendezVous'
          description: ''
    put:
      operationId: appointments_update
      description: '/appointments/: follow-up visits; ?manque=true lists the missed
        ones.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) Rendez-vous.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RendezVousRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RendezVousRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RendezVousRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RendezVous'
          description: ''
    patch:
      operationId: appointments_partial_update
      description: '/appointments/: follow-up visits; ?manque=true lists the missed
        ones.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) Rendez-vous.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRendezVousRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRendezVousRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRendezVousRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RendezVous'
          description: ''
    delete:
      operationId: appointments_destroy
      description: '/appointments/: follow-up visits; ?manque=true lists the missed
        ones.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) Rendez-vous.
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/audit/:
    get:
      operationId: audit_list
      description: '/audit/: read-only audit log, for admins (spec §2: who, what,
        when, device).'
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: depuis
        schema:
          type: string
          format: date-time
      - in: query
        name: jusqu_a
        schema:
          type: string
          format: date-time
      - in: query
        name: ligne_id
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: table
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJournalAuditList'
          description: ''
  /api/audit/{id}/:
    get:
      operationId: audit_retrieve
      description: '/audit/: read-only audit log, for admins (spec §2: who, what,
        when, device).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) Journal d'audit.
        required: true
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalAudit'
          description: ''
  /api/auth/2fa/:
    get:
      operationId: auth_2fa_retrieve
      description: '/auth/2fa/: state of two-factor login for the logged-in user.'
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEtat'
          description: ''
  /api/auth/2fa/activate/:
    post:
      operationId: auth_2fa_activate_create
      description: '/auth/2fa/activate/: check a first code. Returns new tokens.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangerPinReponse'
          description: ''
  /api/auth/2fa/disable/:
    post:
      operationId: auth_2fa_disable_create
      description: '/auth/2fa/disable/: PIN and current code. Refused when it is mandatory.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpDesactivationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpDesactivationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpDesactivationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/auth/2fa/setup/:
    post:
      operationId: auth_2fa_setup_create
      description: '/auth/2fa/setup/: a new secret, to scan as a QR code (otpauth
        URI).'
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpPreparation'
          description: ''
  /api/auth/access-request/:
    post:
      operationId: auth_access_request_create
      description: 'POST /api/auth/access-request/: public. Creates a pending request
        only.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeAccesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DemandeAccesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DemandeAccesRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeAcces'
          description: ''
  /api/auth/access-request/options/:
    get:
      operationId: auth_access_request_options_retrieve
      description: |-
        GET /api/auth/access-request/options/: public. Regions and centres
        (names and types only) to fill the request form.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsDemande'
          description: ''
  /api/auth/changer-pin/:
    post:
      operationId: auth_changer_pin_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangerPinRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangerPinRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangerPinRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangerPinReponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginReponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Only needs the refresh token: the access token may already have
        expired.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
          description: ''
  /api/auth/my-data/:
    get:
      operationId: auth_my_data_retrieve
      description: '/auth/my-data/: loi 2014-038, right of access to one''s own data.'
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonneesPersonnelles'
          description: ''
  /api/auth/my-data/erase/:
    post:
      operationId: auth_my_data_erase_create
      description: '/auth/my-data/erase/: loi 2014-038, right of erasure (beneficiaries).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EffacementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EffacementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EffacementRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffacementReponse'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/children/:
    get:
      operationId: children_list
      description: Common behaviour of the synced tables. Subclasses provide visibles().
      parameters:
      - in: query
        name: asc
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: number
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: statut_prise_en_charge
        schema:
          type: string
          enum:
          - abandon
          - aucun
          - decede
          - gueri
          - non_repondant
          - pris_en_charge
          - refere
          - suivi
          - transfere
        description: |-
          * `aucun` - Aucun
          * `suivi` - Suivi
          * `refere` - Référé
          * `pris_en_charge` - Pris en charge
          * `gueri` - Guéri
          * `abandon` - Abandon
          * `transfere` - Transféré
          * `non_repondant` - Non-répondant
          * `decede` - Décédé
      - in: query
        name: updated_since
        schema:
          type: string
          format: date-time
      tags:
      - children
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnfantList'
          description: ''
    post:
      operationId: children_create
      description: Common behaviour of the synced tables. Subclasses provide visibles().
      tags:
      - children
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnfantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnfantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnfantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enfant'
          description: ''
  /api/children/{enfant_pk}/measurements/:
    get:
      operationId: children_measurements_list
      description: /children/{id}/measurements/. A child outside the user's scope
        gives a 404.
      parameters:
      - in: query
        name: alerte
        schema:
          type: string
          enum:
          - orange
          - rouge
          - vert
        description: |-
          * `vert` - Vert
          * `orange` - Orange
          * `rouge` - Rouge
      - in: query
        name: classification
        schema:
          type: string
          enum:
          - mam
          - mas
          - normal
          - nourrisson_a_risque
        description: |-
          * `mas` - Malnutrition aiguë sévère
          * `mam` - Malnutrition aiguë modérée
          * `normal` - Normal
          * `nourrisson_a_risque` - Nourrisson à risque
      - in: query
        name: date_max
        schema:
          type: string
          format: date
      - in: query
        name: date_min
        schema:
          type: string
          format: date
      - in: path
        name: enfant_pk
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: updated_since
        schema:
          type: string
          format: date-time
      tags:
      - children
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMesureList'
          description: ''
    post:
      operationId: children_measurements_create
      description: /children/{id}/measurements/. A child outside the user's scope
        gives a 404.
      parameters:
      - in: path
        name: enfant_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - children
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesureRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MesureRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MesureRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesure'
          description: ''
  /api/children/{enfant_pk}/measurements/{id}/:
    get:
      operationId: children_measurements_retrieve
      description: /children/{id}/measurements/. A child outside the user's scope
        gives a 404.
      parameters:
      - in: path
        name: enfant_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) Mesure.
        required: true
      tags:
      - children
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesure'
          description: ''
    put:
      operationId: children_measurements_update
      description: /children/{id}/measurements/. A child outside the user's scope
        gives a 404.
      parameters:
      - in: path
        name: enfant_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) Mesure.
        required: true
      tags:
      - children
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesureRequest'
          application/x-www-form-urlencoded:
