  /api/who-reference/:
    get:
      operationId: who_reference_retrieve
      description: |-
        /who-reference/: WHO 2006 growth standards, from the loaded tables only.

        Each point gives the official LMS values and the -3, -2, 0, +2, +3 SD
        curves computed from them (WHO formula). Nothing is served for a table
        that was not imported with `importer_tables_oms`.
      parameters:
      - in: query
        name: cle_max
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,1})?$
      - in: query
        name: cle_min
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,1})?$
      - in: query
        name: indicateur
        schema:
          enum:
          - wfa
          - lhfa
          - wfl
          - wfh
          type: string
          minLength: 1
        description: |-
          * `wfa` - Poids pour âge
          * `lhfa` - Taille pour âge
          * `wfl` - Poids pour longueur
          * `wfh` - Poids pour hauteur
        required: true
      - in: query
        name: pas
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,1})?$
        description: Garder une clé sur `pas` (par exemple 30 jours, ou 1 cm).
      - in: query
        name: sexe
        schema:
          enum:
          - M
          - F
          type: string
          minLength: 1
        description: |-
          * `M` - Masculin
          * `F` - Féminin
        required: true
      tags:
      - who-reference
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceOms'
          description: ''
components:
  schemas:
    AlerteEnum:
      enum:
      - vert
      - orange
      - rouge
      type: string
      description: |-
        * `vert` - Vert
        * `orange` - Orange
        * `rouge` - Rouge
    AppetitEnum:
      enum:
      - non_teste
      - bon
      - mauvais
      type: string
      description: |-
        * `non_teste` - Non testé
        * `bon` - Bon
        * `mauvais` - Mauvais
